---
- name: restart wireguard
  systemd:
    name: "wg-quick@{{ wg_iface }}"
    state: restarted
    enabled: true

- name: restart key acceptor
  systemd:
    name: ff-key-acceptor
    state: restarted
    enabled: true
    daemon_reload: true

- name: reload nginx
  systemd:
    name: nginx
    state: reloaded
